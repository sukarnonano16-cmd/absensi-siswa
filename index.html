<style>

  *{box-sizing:border-box}

  .tabbtn.active{background:#fff;color:#075985}
  .frames{flex:1;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f1f5f9}
  iframe.hide{display:none}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-size:14px;flex-direction:column;gap:12px;z-index:5}
  .loading.gone{display:none}
  .spinner{width:34px;height:34px;border:4px solid #ffffff33;border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:650px){.switchbar{padding:8px 10px}.tabbtn{padding:8px 11px;font-size:12px}.switchbar .brand{font-size:13px;width:100%;margin-bottom:4px}}
</style>

<script>
function b64ToUtf8(b64){
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}
function loadFrame(id, dataId, loadingId){
  var html = b64ToUtf8(document.getElementById(dataId).textContent.trim());
  var frame = document.getElementById(id);
  frame.addEventListener('load', function(){
    var el = document.getElementById(loadingId);
    if(el) el.classList.add('gone');
  }, {once:true});
  frame.srcdoc = html;
}
function switchApp(which){
  var fa = document.getElementById('frameAbsensi'), fb = document.getElementById('frameBK');
  var ta = document.getElementById('tabAbsensi'), tb = document.getElementById('tabBK');
  if(which==='absensi'){
    fa.classList.remove('hide'); fb.classList.add('hide');
    ta.classList.add('active'); tb.classList.remove('active');
  } else {
    fb.classList.remove('hide'); fa.classList.add('hide');
    tb.classList.add('active'); ta.classList.remove('active');
  }
}
loadFrame('frameAbsensi','dataAbsensi','loadingAbsensi');
loadFrame('frameBK','dataBK','loadingBK');
</script>
<script>
(function(){
  var startY = 0, scroller = null;
  function findScrollParent(node){
    while(node && node !== document.body && node !== document.documentElement){
      if(node.scrollHeight > node.clientHeight){
        var oy = window.getComputedStyle(node).overflowY;
        if(oy === 'auto' || oy === 'scroll') return node;
      }
      node = node.parentElement;
    }
    return document.scrollingElement || document.documentElement;
  }
  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    scroller = findScrollParent(e.target);
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1 || !scroller) return;
    var goingDown = e.touches[0].clientY > startY;
    if(goingDown && scroller.scrollTop <= 0){
      e.preventDefault();
    }
  }, {passive:false});
})();
